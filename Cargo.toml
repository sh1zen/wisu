[package]
name = "wisu"
version = "0.1.7"
authors = ["sh1zen <dev.sh1zen@outlook.it>"]
edition = "2024"
description = "A fast minimalist directory tree viewer, written in Rust."
license = "Apache-2.0"
readme = "README.md"
homepage = "https://github.com/sh1zen/wisu"
repository = "https://github.com/sh1zen/wisu"
keywords = ["ls", "tree", "filesystem", "command-line"]
categories = ["command-line-utilities", "filesystem", "development-tools"]

[dependencies]
# terminal
colored = "3.1.1"
indicatif = "0.18.6"
lscolors = "0.21.0"
ratatui = "0.30.2"
#utils
chrono = { version = "0.4.45", features = ["serde"] }
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
ignore = "0.4.31"
once_cell = "1.21.4"
url = "2.5.8"
#manipulation
regex = "1.13.1"
natord = "1.0.9"
# data
csv = "1.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde-xml-rs = "0.8.2"
toml = "1.1.3+spec-1.1.0"
notify = "9.0.0-rc.4"

# Dependencies for testing the command-line interface
[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[build-dependencies]
walkdir = "2.5.0"

[profile.release]
codegen-units = 1
opt-level = 3
lto = true
debug = false
strip = true
panic = "abort"
